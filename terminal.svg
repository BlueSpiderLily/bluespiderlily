<text x="640" y="22" text-anchor="middle" fill="#7d8794" font-size="12" letter-spacing="2" font-family="'JetBrains Mono',ui-monospace,Consolas,monospace">noah@sys: ~</text>
<g font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace" font-size="15">
<text x="36" y="86" fill="#eceff3" clip-path="url(#c0)"><tspan fill="#ff2bd6">$</tspan> whoami</text>
<text x="36" y="112" fill="#9fb2c8" clip-path="url(#c1)">noah: low-level systems, security research, reverse engineering</text>
<text x="36" y="138" fill="#eceff3" clip-path="url(#c2)"><tspan fill="#ff2bd6">$</tspan> cat focus.txt</text>
<text x="36" y="164" fill="#9fb2c8" clip-path="url(#c3)">hypervisors ........ AMD SVM, Windows kernel internals</text>
<text x="36" y="190" fill="#9fb2c8" clip-path="url(#c4)">memory ............. DMA-based access, FPGA hardware</text>
<text x="36" y="216" fill="#9fb2c8" clip-path="url(#c5)">reverse eng ........ anti-tamper and anti-cheat analysis</text>
<text x="36" y="242" fill="#9fb2c8" clip-path="url(#c6)">embedded ........... bare-metal C on STM32</text>
<text x="36" y="268" fill="#eceff3" clip-path="url(#c7)"><tspan fill="#ff2bd6">$</tspan> ls projects/</text>
<text x="36" y="294" fill="#4d8dff" clip-path="url(#c8)">SVMCheck/</text>

<text x="36" y="326" fill="#ff2bd6" opacity="0">$<animate attributeName="opacity" values="0;1" begin="7.87s" dur="0.01s" fill="freeze"/></text>
